<!doctype html>
<html lang="pt-BR" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Link</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Outfit', sans-serif; }
    .link-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .link-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .avatar-ring {
      animation: pulse-ring 3s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4); }
      50% { box-shadow: 0 0 0 12px rgba(168, 85, 247, 0); }
    }
    .fade-in {
      animation: fadeUp 0.6s ease forwards;
      opacity: 0;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
  <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto" style="background-image: linear-gradient(rgba(12,12,12,0.55), rgba(12,12,12,0.55)), url('./logo.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">
   <div class="max-w-md mx-auto px-6 py-12 flex flex-col items-center min-h-full justify-center">
    <!-- Avatar -->
    <div class="fade-in" style="animation-delay: 0.1s;">
    <div class="w-28 h-28 rounded-full avatar-ring overflow-hidden border-4 border-slate-500/50 bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center">
     <img src="./logo.jpg" alt="Studio AS" class="w-24 h-24 object-contain" />
    </div>
      </div><!-- Name & Bio -->
    <h1 id="name" class="fade-in mt-5 text-2xl font-bold text-white" style="animation-delay: 0.2s;">Studio AS</h1>
    <p id="bio" class="fade-in mt-2 text-gray-400 text-center text-sm" style="animation-delay: 0.3s;">Salão de beleza • Estética</p><!-- Links -->
    <div class="w-full mt-8 space-y-4">
     <a id="link1" href="https://www.instagram.com/amandasimplicioesteticaebeleza/" target="_blank" rel="noopener noreferrer" class="fade-in link-btn block w-full py-4 px-6 rounded-2xl text-center font-medium text-white bg-white/10 backdrop-blur border border-white/10 hover:border-slate-300/50" style="animation-delay: 0.4s;"> <span class="link-text">📸 Instagram</span> </a>
    </div><!-- Services -->
    <div class="w-full mt-10 pt-8 border-t border-white/10">
     <h2 class="fade-in text-center text-lg font-semibold text-white mb-4" style="animation-delay: 0.5s;">Nossos Serviços</h2>
     <div class="space-y-3">
      <div id="service1" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 0.6s;">
       Selagem
      </div>
      <div id="service2" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 0.65s;">
       Mechas
      </div>
      <div id="service3" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 0.7s;">
       Corte
      </div>
      <div id="service4" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 0.75s;">
       Escova
      </div>
      <div id="service5" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 0.8s;">
       Coloração
      </div>
      <div id="service6" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 0.85s;">
       Depilação
      </div>
      <div id="service7" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 0.9s;">
       Micropigmentação
      </div>
      <div id="service8" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 0.95s;">
       Extensão de Cílios
      </div>
      <div id="service9" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 1s;">
       Penteado
      </div>
      <div id="service10" class="fade-in service-item p-4 rounded-xl bg-white/5 border border-white/10 text-center text-sm text-gray-300" style="animation-delay: 1.05s;">
       Maquiagem
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
    lucide.createIcons();

    const defaultConfig = {
      display_name: 'Studio AS',
      bio_text: 'Salão de beleza • Estética',
      link_1_text: '📸 Instagram',
      link_1_url: 'https://www.instagram.com/amandasimplicioesteticaebeleza/',
      service_1: 'Selagem',
      service_2: 'Mechas',
      service_3: 'Corte',
      service_4: 'Escova',
      service_5: 'Coloração',
      service_6: 'Depilação',
      service_7: 'Micropigmentação',
      service_8: 'Extensão de Cílios',
      service_9: 'Penteado',
      service_10: 'Maquiagem',
      primary_color: '#6b7280',
      bg_color: '#101419',
      text_color: '#f8fafc',
      surface_color: '#111827',
      accent_color: '#9ca3af',
      font_family: 'Outfit',
      font_size: 16
    };

    async function onConfigChange(config) {
      document.getElementById('name').textContent = config.display_name || defaultConfig.display_name;
      document.getElementById('bio').textContent = config.bio_text || defaultConfig.bio_text;
      document.querySelector('#link1 .link-text').textContent = config.link_1_text || defaultConfig.link_1_text;
      document.getElementById('link1').href = config.link_1_url || defaultConfig.link_1_url;

      document.getElementById('service1').textContent = config.service_1 || defaultConfig.service_1;
      document.getElementById('service2').textContent = config.service_2 || defaultConfig.service_2;
      document.getElementById('service3').textContent = config.service_3 || defaultConfig.service_3;
      document.getElementById('service4').textContent = config.service_4 || defaultConfig.service_4;
      document.getElementById('service5').textContent = config.service_5 || defaultConfig.service_5;
      document.getElementById('service6').textContent = config.service_6 || defaultConfig.service_6;
      document.getElementById('service7').textContent = config.service_7 || defaultConfig.service_7;
      document.getElementById('service8').textContent = config.service_8 || defaultConfig.service_8;
      document.getElementById('service9').textContent = config.service_9 || defaultConfig.service_9;
      document.getElementById('service10').textContent = config.service_10 || defaultConfig.service_10;

      const font = config.font_family || defaultConfig.font_family;
      const size = config.font_size || defaultConfig.font_size;
      document.body.style.fontFamily = `${font}, Outfit, sans-serif`;
      document.getElementById('name').style.fontSize = `${size * 1.5}px`;
      document.getElementById('bio').style.fontSize = `${size * 0.875}px`;

      const primary = config.primary_color || defaultConfig.primary_color;
      const bg = config.bg_color || defaultConfig.bg_color;
      const text = config.text_color || defaultConfig.text_color;
      const surface = config.surface_color || defaultConfig.surface_color;
      const accent = config.accent_color || defaultConfig.accent_color;

      const app = document.getElementById('app');
      // Preserve any existing background image (e.g., ./fundo.jpg) when recoloring.
      (function preserveBgImage() {
        if (window._appBgImageUrl === undefined) {
          // Try inline style first
          const inline = app.style.backgroundImage || '';
          const m1 = inline.match(/url\((?:'|\")?(.*?)(?:'|\")?\)/);
          if (m1) { window._appBgImageUrl = m1[1]; return; }
          // Fallback to computed style
          const cs = window.getComputedStyle(app).backgroundImage || '';
          const m2 = cs.match(/url\((?:'|\")?(.*?)(?:'|\")?\)/);
          window._appBgImageUrl = m2 ? m2[1] : '';
        }
      })();

      const gradient = `linear-gradient(145deg, ${bg} 0%, ${surface} 50%, ${bg} 100%)`;
      if (window._appBgImageUrl) {
        app.style.backgroundImage = `${gradient}, url('${window._appBgImageUrl}')`;
        app.style.backgroundSize = 'cover';
        app.style.backgroundPosition = 'center';
        app.style.backgroundRepeat = 'no-repeat';
      } else {
        app.style.background = gradient;
      }
      document.getElementById('name').style.color = text;
      
      const avatar = document.querySelector('.avatar-ring');
      avatar.style.borderColor = primary;

      document.querySelectorAll('.link-btn').forEach(btn => {
        btn.style.color = text;
        btn.style.borderColor = `${primary}33`;
      });

      document.querySelectorAll('.service-item').forEach(item => {
        item.style.color = text;
        item.style.borderColor = `${primary}33`;
      });
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          { get: () => config.bg_color || defaultConfig.bg_color, set: v => { config.bg_color = v; window.elementSdk.setConfig({ bg_color: v }); } },
          { get: () => config.surface_color || defaultConfig.surface_color, set: v => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
          { get: () => config.text_color || defaultConfig.text_color, set: v => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
          { get: () => config.primary_color || defaultConfig.primary_color, set: v => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
          { get: () => config.accent_color || defaultConfig.accent_color, set: v => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } }
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: v => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: v => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['display_name', config.display_name || defaultConfig.display_name],
        ['bio_text', config.bio_text || defaultConfig.bio_text],
        ['link_1_text', config.link_1_text || defaultConfig.link_1_text],
        ['link_1_url', config.link_1_url || defaultConfig.link_1_url],
        ['service_1', config.service_1 || defaultConfig.service_1],
        ['service_2', config.service_2 || defaultConfig.service_2],
        ['service_3', config.service_3 || defaultConfig.service_3],
        ['service_4', config.service_4 || defaultConfig.service_4],
        ['service_5', config.service_5 || defaultConfig.service_5],
        ['service_6', config.service_6 || defaultConfig.service_6],
        ['service_7', config.service_7 || defaultConfig.service_7],
        ['service_8', config.service_8 || defaultConfig.service_8],
        ['service_9', config.service_9 || defaultConfig.service_9],
        ['service_10', config.service_10 || defaultConfig.service_10]
      ]);
    }

    window.elementSdk.init({ defaultConfig, onConfigChange, mapToCapabilities, mapToEditPanelValues });
  </script>
